<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="成人健康檢查社區共讀簡報：六頁立體書，點立牌看重點卡。"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>健檢立體書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左邊是一本會立起來的立體書（每一頁一個房間，立牌＝重點），右邊是一張大字紙卡；單一紙感外觀，不分深淺色 */
:root{
  color-scheme:light;
  --paper:#f1efe9; --sheet:#fbfaf6; --ink:#2b22d6; --ink-2:rgba(43,34,214,.14); --text:#1c1947; --mute:#5d5a80;
  --lilac:#ddd7f4; --pink:#f6d3da; --butter:#f6e8bb; --sky:#d2e4f5; --red:#d3304a;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --S:320px; --H:200px;
  --fs:clamp(16px,min(1.5vw,2.75vh),30px);
}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:var(--fs);line-height:1.5;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 40%,#f7f6f1 0%,var(--paper) 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
svg.defs{position:absolute;width:0;height:0}

.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);gap:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* ---------- 左：立體書 ---------- */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.tab{font-family:var(--hand);font-weight:700;font-size:.78em;padding:.28em .7em;border:2px solid var(--ink);border-radius:12px 14px 4px 4px/14px 12px 4px 4px;color:var(--ink);background:var(--sheet)}
.tab[aria-current="true"]{background:var(--ink);color:#fff}
.scene{position:relative;flex:1;min-height:0;overflow:hidden}
.book{position:absolute;left:50%;top:50%;width:var(--S);height:var(--S);margin:calc(var(--S)/-2) 0 0 calc(var(--S)/-2);
  transform:translateY(calc(var(--k,1)*78px)) scale(var(--k,1)) rotateX(57deg) rotateZ(45deg);transform-style:preserve-3d}
.book *{box-sizing:border-box}
#pages,#standees{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#pages>*,#standees>*{pointer-events:auto}
.shadow{position:absolute;inset:-40px -40px -70px -70px;background:radial-gradient(closest-side,rgba(40,36,90,.28),rgba(40,36,90,0) 100%);transform:translateZ(-3px)}
.floor{position:absolute;inset:0;border:3px solid var(--ink);background-color:var(--room,var(--lilac));
  background-image:repeating-linear-gradient(0deg,var(--ink-2) 0 1.5px,transparent 1.5px 40px),repeating-linear-gradient(90deg,var(--ink-2) 0 1.5px,transparent 1.5px 40px);transition:background-color .6s}
.wall{position:absolute;border:3px solid var(--ink);background-color:#f8f7fb;
  background-image:repeating-linear-gradient(135deg,rgba(43,34,214,.07) 0 1.5px,transparent 1.5px 9px);transition:transform .9s cubic-bezier(.3,1.35,.5,1)}
.wr{left:0;top:calc(-1*var(--H));width:var(--S);height:var(--H);transform-origin:50% 100%;transform:rotateX(-90deg)}
.wl{left:calc(-1*var(--H));top:0;width:var(--H);height:var(--S);transform-origin:100% 50%;transform:rotateY(90deg)}
.book.closed .wr{transform:rotateX(-177deg)}
.book.closed .wl{transform:rotateY(177deg)}
.wl .wface{position:absolute;left:50%;top:50%;width:var(--S);height:var(--H);margin:calc(var(--H)/-2) 0 0 calc(var(--S)/-2);transform:rotate(-90deg)}
.wr .wface{position:absolute;inset:0}
.wface{transition:opacity .3s}
.book.folded .wface{opacity:0}
.wface svg{width:100%;height:100%;display:block}
.poster{position:absolute;left:34px;top:22px;right:34px;bottom:26px;border:2.5px solid var(--ink);background:var(--sheet);border-radius:6px 9px 5px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--hand);color:var(--ink);text-align:center;cursor:pointer}
.poster small{font-size:17px}
.poster b{font-size:50px;line-height:1.1}
.poster span{font-size:20px;color:var(--text)}
.poster::before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:18px;margin-left:-32px;background:var(--butter);border:2px solid var(--ink);transform:rotate(-3deg)}
.pw{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:rotateZ(var(--a));transition:transform .85s cubic-bezier(.45,0,.3,1)}
.pg{position:absolute;left:0;top:calc(-1*var(--H));width:var(--S);height:var(--H);transform-origin:50% 100%;transform:rotateX(-90deg);border:2.5px solid var(--ink);
  background-color:rgba(246,245,250,.93);background-image:repeating-linear-gradient(135deg,rgba(43,34,214,.16) 0 1.5px,transparent 1.5px 6px)}
.standee{position:absolute;left:var(--x);top:var(--y);width:88px;height:112px;margin:-112px 0 0 -44px;transform-origin:50% 100%;
  transform:translateZ(1px) rotateZ(-45deg) rotateX(-90deg);transition:transform .65s cubic-bezier(.3,1.6,.5,1);transition-delay:calc(var(--i)*80ms + 250ms)}
.book.folded .standee,.book.closed .standee{transform:translateZ(1px) rotateZ(-45deg) rotateX(-3deg);transition:transform .28s ease-in;transition-delay:0s}
.sign{position:absolute;left:0;right:0;top:0;height:94px;border:3px solid var(--ink);border-radius:16px 20px 14px 18px/18px 14px 20px 16px;background:var(--sheet);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--hand);color:var(--ink);transition:transform .25s,background-color .25s;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.sign b{font-size:40px;line-height:1.05}
.sign span{font-size:15px;line-height:1.15;color:var(--text);font-weight:700;white-space:nowrap}
.standee::after{content:"";position:absolute;left:50%;bottom:0;width:12px;height:20px;margin-left:-6px;background:var(--sheet);border:3px solid var(--ink);border-top:0}
.standee.seen .sign{background:var(--sky)}
.standee.on .sign{background:var(--butter);transform:translateY(-10px) rotate(-2deg)}
.standee:hover .sign{transform:translateY(-6px)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:3;padding-bottom:4px}
.arrow{width:clamp(56px,6vw,92px);height:clamp(44px,4.6vw,64px);color:var(--ink);flex:none}
.arrow svg{width:100%;height:100%}
.arrow:disabled{opacity:.25;cursor:default}
.room{flex:1;min-width:0;text-align:center;font-family:var(--hand);font-weight:700;color:var(--ink);font-size:clamp(24px,2.6vw,44px);line-height:1.1}
.room small{display:block;font-size:.5em;color:var(--mute);font-weight:400;margin-top:.2em}

/* ---------- 右：紙卡 ---------- */
.sheet{position:relative;min-width:0;min-height:0;margin-left:clamp(8px,1.4vw,24px);background:var(--sheet);border-radius:18px;display:flex;flex-direction:column;
  padding:clamp(16px,2.2vw,36px);gap:clamp(10px,1.6vh,20px);box-shadow:0 14px 40px -22px rgba(30,26,90,.5)}
.sheet::before{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:18px 26px 20px 30px/28px 18px 30px 20px;filter:url(#wob);pointer-events:none}
.kick{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--hand);color:var(--ink);font-size:.9em}
.pips{display:flex;gap:7px}
.pip{width:1.05em;height:1.05em;border:2px solid var(--ink);border-radius:50%}
.pip[aria-current="true"]{background:var(--ink)}
.tools{display:flex;gap:8px}
.tool{font-family:var(--hand);font-size:.82em;border:2px solid var(--ink);border-radius:999px;padding:.1em .7em;color:var(--ink)}
h1.h{font-family:var(--hand);font-weight:700;font-size:clamp(26px,min(3.2vw,6vh),60px);line-height:1.18;color:var(--ink);margin:0;text-wrap:balance}
.bodyx{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,22px);overflow-y:auto;animation:in .35s ease}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{margin:0;font-size:1.22em;font-weight:500;line-height:1.45;text-wrap:balance}
.lead em,.tile em,.cmp em{font-style:normal;background:linear-gradient(transparent 58%,var(--butter) 58%)}
.tiles{flex:1;display:grid;gap:clamp(8px,1.2vw,16px);grid-auto-rows:1fr;grid-template-columns:repeat(var(--c,2),minmax(0,1fr))}
.tile{border:2.5px solid var(--ink);border-radius:14px 18px 12px 16px/16px 12px 18px 14px;padding:.7em .85em;display:flex;flex-direction:column;justify-content:center;gap:.25em;background:#fff;min-width:0}
.tile:nth-child(4n+1){background:var(--lilac)}.tile:nth-child(4n+2){background:var(--sky)}.tile:nth-child(4n+3){background:var(--butter)}.tile:nth-child(4n+4){background:var(--pink)}
.tile b{font-family:var(--hand);font-size:1.45em;line-height:1.15;color:var(--ink)}
.tile.num b{font-size:2.3em}
.tile span{line-height:1.45}
.flow{flex:1;display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:.4em;align-items:stretch}
.flow .tile{position:relative;text-align:center;align-items:center}
.flow .tile i{font-style:normal;font-family:var(--hand);color:var(--mute);font-size:.85em}
.tri{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.col{border:2.5px solid var(--ink);border-radius:14px 18px 12px 16px/16px 12px 18px 14px;padding:.6em .8em;display:flex;flex-direction:column;min-width:0;background:#fff}
.col h3{margin:0 0 .3em;font-family:var(--hand);font-size:1.2em;color:var(--ink);border-bottom:2px dashed var(--ink);padding-bottom:.2em}
.col.red{background:#fdeef0;border-color:var(--red)} .col.red h3{color:var(--red);border-color:var(--red)}
.col.life{background:var(--sky)}
.col ul{margin:0;padding:0;list-style:none;flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:.35em}
.col li{padding-left:1em;position:relative;line-height:1.4}
.col li::before{content:"";position:absolute;left:0;top:.55em;width:.45em;height:.45em;border-radius:50%;background:currentColor;opacity:.55}
table.cmp{flex:1;width:100%;border-collapse:separate;border-spacing:0;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;table-layout:fixed}
.cmp th,.cmp td{padding:.5em .7em;border-bottom:2px dashed var(--ink-2);vertical-align:middle;text-align:left;line-height:1.4}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.cmp thead th{font-family:var(--hand);font-size:1.2em;color:var(--ink);background:var(--lilac);border-bottom:2.5px solid var(--ink)}
.cmp tbody th{font-family:var(--hand);color:var(--ink);width:6.2em;background:var(--butter)}
.cmp td.both{text-align:center;background:var(--sky)}
.note{margin:0;font-size:.86em;color:var(--mute);line-height:1.45}
.warn{margin:0;border:2.5px solid var(--red);border-radius:12px;padding:.5em .8em;background:#fdeef0;line-height:1.45}
.ask{font-family:var(--hand);font-size:1.05em;background:var(--butter);border-radius:10px;padding:.45em .8em;line-height:1.35;display:flex;gap:.6em;align-items:baseline}
.ask b{color:var(--ink);white-space:nowrap}
.src{font-size:.62em;color:var(--mute);line-height:1.3}
.stairs{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:0}
.stair{border:2.5px solid var(--ink);padding:.6em .7em;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--sky);border-radius:12px 12px 0 0}
.stair:nth-child(1){height:46%;background:var(--lilac)}.stair:nth-child(2){height:72%;margin-left:-2.5px}.stair:nth-child(3){height:100%;margin-left:-2.5px;background:var(--butter)}
.stair b{font-family:var(--hand);font-size:1.5em;color:var(--ink);line-height:1.15}.stair span{font-size:1.25em;font-weight:700}
/* 迷思 */
.myth{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);min-height:0}
.say{font-family:var(--hand);font-size:1.75em;line-height:1.4;border:2.5px solid var(--ink);border-radius:26px 30px 28px 6px;padding:.6em .8em;background:var(--pink);flex:1;display:flex;align-items:center;transition:font-size .3s}
.flip{align-self:center;font-family:var(--hand);font-weight:700;font-size:1.3em;background:var(--ink);color:#fff;border-radius:999px;padding:.35em 1.4em}
.myth.open .say{flex:none;font-size:.92em;line-height:1.3;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;padding:.35em .7em}
.myth.open .flip{display:none}
.truth{flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);min-height:0}
.bubbles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,14px);grid-auto-rows:1fr}
.bubble{font-family:var(--hand);font-size:1.12em;text-align:left;line-height:1.35;border:2.5px solid var(--ink);border-radius:22px 26px 24px 6px;padding:.5em .8em;background:#fff;display:flex;align-items:center}
.bubble:nth-child(odd){background:var(--pink)} .bubble:nth-child(even){background:var(--lilac);border-radius:26px 22px 6px 24px}
/* 資格查詢 */
.elig{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(10px,1.2vw,18px);min-height:0}
.ctl{display:flex;flex-direction:column;gap:.6em;justify-content:space-between}
.ctl h3,.out h3{margin:0;font-family:var(--hand);color:var(--ink);font-size:1.1em}
.age{display:flex;align-items:center;justify-content:space-between;gap:.3em;border:2.5px solid var(--ink);border-radius:14px;padding:.3em;background:#fff}
.age output{font-family:var(--hand);font-weight:700;font-size:2em;color:var(--ink);line-height:1;flex:1;text-align:center}
.age button{font-family:var(--hand);font-weight:700;font-size:.95em;border:2px solid var(--ink);border-radius:10px;padding:.25em .3em;background:var(--lilac);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.chip{border:2.5px solid var(--ink);border-radius:12px;padding:.4em .6em;background:#fff;text-align:left;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.out{border:2.5px solid var(--ink);border-radius:16px;background:var(--sky);padding:.6em .8em;display:flex;flex-direction:column;gap:.4em;min-height:0;overflow-y:auto}
.out ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em;flex:1;justify-content:space-evenly}
.out li{background:#fff;border-radius:10px;padding:.3em .6em;line-height:1.35;display:flex;gap:.5em;justify-content:space-between;align-items:baseline}
.out li b{color:var(--ink);font-family:var(--hand);white-space:nowrap}
.out li span{font-size:.88em;color:var(--mute);text-align:right}
.pledge{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--hand);font-size:2em;line-height:1.9;border:2.5px dashed var(--ink);border-radius:20px;background:var(--butter);padding:.5em}
.pledge u{text-decoration:none;display:inline-block;min-width:2.6em;border-bottom:3px solid var(--ink)}

/* ---------- 封面 ---------- */
.cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;perspective:1600px;
  background:radial-gradient(ellipse at 50% 40%,#f7f6f1 0%,var(--paper) 70%);padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;transition:opacity .5s .35s,visibility 0s .9s}
.cover.gone{opacity:0;visibility:hidden;pointer-events:none}
.cv{position:relative;width:min(90vw,calc(84vh*1.3),980px);aspect-ratio:1.3;max-width:100%;transform:rotate(-3deg);transform-origin:0 50%;transition:transform .8s cubic-bezier(.5,0,.3,1);
  background-color:#f8f7fb;background-image:repeating-linear-gradient(135deg,rgba(43,34,214,.09) 0 1.5px,transparent 1.5px 9px);border-radius:8px 22px 22px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4.5% 7% 4.5% 11%;text-align:center;font-family:var(--hand);color:var(--ink);box-shadow:16px 22px 40px -18px rgba(30,26,90,.5)}
.cover.gone .cv{transform:rotate(-3deg) rotateY(-105deg)}
.cv::before{content:"";position:absolute;inset:0;border:4px solid var(--ink);border-radius:8px 22px 22px 8px;filter:url(#wob)}
.cv::after{content:"";position:absolute;left:5.5%;top:0;bottom:0;border-left:3px dashed var(--ink)}
.cv small{font-size:clamp(14px,min(2.2vw,3vh),26px);letter-spacing:.2em}
.cv h2{margin:0;font-size:clamp(32px,min(7.4vw,11vh),104px);line-height:1.1;font-weight:700}
.cv h2 br{display:none}
.cv p{margin:0;font-size:clamp(15px,min(2.2vw,3.2vh),28px);color:var(--text);line-height:1.45}
.cv svg{height:30%;width:auto}
.cv .go{font-size:clamp(18px,3vh,30px);font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:.3em 1.3em;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}

@media (max-width:820px){
  :root{--fs:clamp(15px,4vw,19px)}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,41fr) minmax(0,59fr);gap:8px;padding-block:8px}
  .sheet{margin-left:0;padding:14px}
  .tab{font-size:.7em;padding:.2em .5em}
  .tri,.elig{grid-template-columns:minmax(0,1fr)}
  .tiles,.bubbles{--c:1!important;grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .say{font-size:1.3em}.pledge{font-size:1.4em}
  .tools{display:none}
  .cv{width:min(88vw,calc(84vh*.78));aspect-ratio:.78;padding:8% 8% 7% 13%}
  .cv h2{font-size:clamp(34px,11vw,64px)} .cv h2 br{display:inline}
  .cv svg{height:auto;width:66%}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>

<svg class="defs" aria-hidden="true"><defs>
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
</defs></svg>

<div class="cover" id="cover">
  <button class="cv" id="openBtn" aria-label="翻開立體書">
    <small>社區共讀・成人健康檢查</small>
    <h2>翻開健康<br>這本書</h2>
    <svg viewBox="0 0 300 190" fill="none" stroke="#2b22d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M150 178 L40 122 L40 40 L150 86 Z" fill="#ddd7f4"/><path d="M150 178 L260 122 L260 40 L150 86 Z" fill="#d2e4f5"/>
      <path d="M150 86 L150 178"/><path d="M40 40 L150 8 L260 40" /><path d="M150 8 L150 86"/>
      <path d="M70 72 L112 90 L112 128 L70 110 Z" fill="#fbfaf6"/><path d="M91 81 L91 119 M70 91 L112 109"/>
      <path d="M196 82 q10 -14 20 0 q10 -14 20 0 q0 16 -20 30 q-20 -14 -20 -30 Z" fill="#f6d3da"/>
      <path d="M176 150 l14 -7 M212 132 l14 -7 M194 141 l14 -7" />
    </svg>
    <p>六頁立體書，一頁一個房間。<br>點房間裡的小立牌，看一張重點卡。</p>
    <span class="go">點一下，翻開</span>
  </button>
</div>

<div class="app">
  <section class="stage" aria-label="立體書">
    <nav class="tabs" id="tabs" aria-label="頁次"></nav>
    <div class="scene" id="scene">
      <div class="book closed folded" id="book">
        <div class="shadow"></div>
        <div id="pages"></div>
        <div class="floor"></div>
        <div class="wall wr"><div class="wface" id="wr"></div></div>
        <div class="wall wl"><div class="wface" id="wl"></div></div>
        <div id="standees"></div>
      </div>

]},

 {k:'約',s:'一起約定',h:'我們的約定',b:`<div class="pledge"><div>我預計在 <u>&nbsp;</u> 月，<br>和 <u>&nbsp;</u> 一起去做健康檢查。</div></div><p class="note">本簡報為衛教用途。補助資格與項目以國民健康署、勞動部最新公告為準；個人狀況請與醫師討論。</p>`,ask:'請每個人說出自己的月份。'}

];
CH.forEach(c=>c.cards.forEach(x=>{if(x.say){x.h='迷思：'+x.s;x.b=M(x.say,x.truth,x.tiles)}}));

/* ---------- 狀態與繪製 ---------- */
const $=id=>document.getElementById(id);
const book=$('book'),S=320;
let ci=0,ki=0,opened=false,timer=0;
const seen=new Set();
const POS={3:[[-140,330],[0,330],[140,330]],4:[[-80,250],[80,250],[-80,470],[80,470]],6:[[-140,250],[0,250],[140,250],[-140,470],[0,470],[140,470]]};

$('tabs').innerHTML=CH.map((c,i)=>`<button class="tab" data-c="${i}">${i+1} ${c.room}</button>`).join('');
$('pages').innerHTML=CH.slice(1).map((_,j)=>`<div class="pw" data-j="${j}"><div class="pg"></div></div>`).join('');

function setPages(){document.querySelectorAll('.pw').forEach(p=>{const j=+p.dataset.j;p.style.setProperty('--a',(j<ci?100+(ci-1-j)*8:-10-(j-ci)*8)+'deg')})}
function renderRoom(){
  const c=CH[ci];book.style.setProperty('--room',c.color);
  $('wr').innerHTML=`<button class="poster" id="poster"><small>第 ${ci+1} 頁</small><b>${c.room}</b><span>${c.title}</span></button>`;
  $('wl').innerHTML=`<svg viewBox="0 0 320 200" fill="none" stroke="#2b22d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${DOODLE[ci]}</svg>`;
  const n=c.cards.length-1,pos=POS[n]||POS[6];
  $('standees').innerHTML=c.cards.slice(1).map((x,i)=>{const[d,s]=pos[i];return `<button class="standee" data-k="${i+1}" style="--x:${(s+d)/2}px;--y:${(s-d)/2}px;--i:${i}" aria-label="${x.s}"><span class="sign"><b>${x.k}</b><span>${x.s}</span></span></button>`}).join('');
  mark();
}
function mark(){document.querySelectorAll('.standee').forEach(b=>{const k=+b.dataset.k;b.classList.toggle('on',k===ki);b.classList.toggle('seen',k!==ki&&seen.has(ci+'-'+k))})}
function renderSheet(){
  const c=CH[ci],x=c.cards[ki];seen.add(ci+'-'+ki);
  $('kick').textContent=`第 ${ci+1} 頁　${c.room}`;
  $('pips').innerHTML=c.cards.map((_,i)=>`<button class="pip" data-k="${i}" aria-label="第 ${i+1} 張" ${i===ki?'aria-current="true"':''}></button>`).join('');
  $('h').textContent=x.h;
  const b=$('body');b.innerHTML=x.b;b.style.animation='none';b.offsetWidth;b.style.animation='';b.scrollTop=0;
  $('ask').innerHTML=`<b>${x.askTag||'問問大家'}</b><span>${x.ask||''}</span>`;$('ask').hidden=!x.ask;
  $('src').textContent=x.src||'';$('src').hidden=!x.src;
  if($('bubbles'))$('bubbles').innerHTML=c.cards.slice(1).map((m,i)=>`<button class="bubble" data-k="${i+1}">「${m.say.length>24?m.say.slice(0,m.say.indexOf('。')>0?m.say.indexOf('。'):24)+'…':m.say}」</button>`).join('');
  if($('elig'))elig();
  $('room').innerHTML=`${c.room}<small>${c.title}　${ki+1} / ${c.cards.length}</small>`;
  document.querySelectorAll('.tab').forEach((t,i)=>t.setAttribute('aria-current',i===ci));
  $('prev').disabled=ci===0&&ki===0;$('next').disabled=ci===CH.length-1&&ki===c.cards.length-1;
  try{history.replaceState(null,'','#p'+(ci+1))}catch(e){}
}
function go(c,k){
  if(c<0||c>=CH.length)return;k=Math.max(0,Math.min(k,CH[c].cards.length-1));
  if(c!==ci){ci=c;ki=k;book.classList.add('folded');setPages();renderSheet();clearTimeout(timer);
    timer=setTimeout(()=>{renderRoom();requestAnimationFrame(()=>requestAnimationFrame(()=>book.classList.remove('folded')))},520);}
  else{ki=k;renderSheet();mark();}
}
function next(){const m=document.querySelector('.myth:not(.open)');if(m)return reveal();
  if(ki<CH[ci].cards.length-1)go(ci,ki+1);else if(ci<CH.length-1)go(ci+1,0)}
function prev(){if(ki>0)go(ci,ki-1);else if(ci>0)go(ci-1,CH[ci-1].cards.length-1)}
function reveal(){const m=document.querySelector('.myth');if(!m)return;m.classList.add('open');m.querySelector('.truth').hidden=false}
function openBook(){if(opened)return;opened=true;$('cover').classList.add('gone');setTimeout(()=>book.classList.remove('closed','folded'),450)}
function fit(){const r=$('scene').getBoundingClientRect();book.style.setProperty('--k',Math.max(.4,Math.min(r.width/560,(r.height-10)/455,1.9)).toFixed(3))}

/* 公費資格查詢 */
const E={age:68,sex:'女',smoke:false,colon:false,lung:false};
function elig(){
  const a=E.age,f=E.sex==='女',r=[];
  if(a>=65)r.push(['成人健檢','每年 1 次']);else if(a>=40)r.push(['成人健檢','每 3 年 1 次']);else if(a>=30)r.push(['成人健檢','每 5 年 1 次']);
  if(a>=40&&a<=79)r.push(['B、C 肝篩檢','終身 1 次']);
  if((a>=45&&a<=74)||(E.colon&&a>=40&&a<=44))r.push(['大腸癌糞便潛血','每 2 年 1 次']);
  if(a>=45&&a<=74)r.push(['胃幽門桿菌檢測','終身 1 次']);
  if(f&&a>=40&&a<=74)r.push(['乳房 X 光攝影','每 2 年 1 次']);
  if(f&&a>=30)r.push(['子宮頸抹片','每年可做，至少 3 年 1 次']);else if(f&&a>=25)r.push(['子宮頸抹片','每 3 年 1 次']);
  if(f&&[35,45,65].includes(a))r.push(['HPV 檢測','今年 1 次']);
  if(E.smoke&&a>=30)r.push(['口腔黏膜檢查','每 2 年 1 次']);
  if(E.lung&&a<=74&&a>=(f?40:45))r.push(['肺癌低劑量電腦斷層','每 2 年 1 次']);
  else if(E.smoke&&a>=50&&a<=74)r.push(['肺癌低劑量電腦斷層','吸菸達 20 包-年者']);
  if(a>=65){r.push(['長者功能評估','每年 1 次']);r.push(['流感、新冠、肺炎鏈球菌疫苗','問衛生所'])}
  const chip=(k,t)=>`<button class="chip" data-e="${k}" aria-pressed="${E[k]}">${t}</button>`;
  $('elig').innerHTML=`<div class="ctl"><h3>年齡</h3><div class="age"><button data-d="-5">−5</button><button data-d="-1">−1</button><output>${a}</output><button data-d="1">+1</button><button data-d="5">+5</button></div>
   <h3>性別</h3><div class="seg"><button class="chip" data-s="女" aria-pressed="${f}">女</button><button class="chip" data-s="男" aria-pressed="${!f}">男</button></div>
   <h3>有沒有這些情形</h3>${chip('smoke','抽菸或嚼檳榔（含已戒）')}${chip('colon','家人得過大腸癌')}${chip('lung','家人得過肺癌')}</div>
   <div class="out"><h3>${a} 歲${E.sex}性，可以做 ${r.length} 項</h3><ul>${r.length?r.map(([n,t])=>`<li><b>${n}</b><span>${t}</span></li>`).join(''):'<li><b>30 歲起就有公費成人健檢</b></li>'}</ul></div>`;
}

/* ---------- 操作 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='openBtn')return openBook();
  if(t.id==='next')return next();if(t.id==='prev')return prev();
  if(t.id==='flip')return reveal();
  if(t.id==='poster')return go(ci,0);
  if(t.id==='home'){opened=false;book.classList.add('closed','folded');$('cover').classList.remove('gone');return}
  if(t.id==='full'){const d=document;try{(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen()).catch(()=>{})}catch(_){}return}
  if(t.dataset.c)return go(+t.dataset.c,0);
  if(t.dataset.k)return go(ci,+t.dataset.k);
  if(t.dataset.d){E.age=Math.max(25,Math.min(95,E.age+ +t.dataset.d));return elig()}
  if(t.dataset.s){E.sex=t.dataset.s;return elig()}
  if(t.dataset.e){E[t.dataset.e]=!E[t.dataset.e];return elig()}
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!opened){if(['Enter',' ','ArrowRight'].includes(e.key)){e.preventDefault();openBook()}return}
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key>='1'&&e.key<=String(CH.length))go(+e.key-1,0);
  else if(e.key==='f'||e.key==='F')$('full').click();
});
addEventListener('resize',fit);
const h0=/^#p([1-6])$/.exec(location.hash);if(h0)ci=+h0[1]-1;
setPages();renderRoom();renderSheet();fit();
</script>
